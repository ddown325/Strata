<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>STRATA</title>
<style>
  :root{
    --bg0:#0e0c09; --bg1:#16130e; --bg2:#1d1913;
    --line:#2c2519; --line2:#3a3122;
    --txt:#d8d1c0; --dim:#8b8171; --faint:#5c5546;
    --amber:#d99a3d; --good:#8aa668; --bad:#b0603f;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;background:var(--bg0);color:var(--txt);
       font-family:ui-monospace,'Cascadia Mono','JetBrains Mono',Consolas,monospace;
       font-variant-numeric:tabular-nums;font-size:13px}
  canvas{display:block}

  #hud{position:fixed;top:0;right:0;text-align:right;padding:18px 20px;z-index:10;pointer-events:none}
  #ores{margin:0;font-size:26px;color:var(--amber);font-weight:700;letter-spacing:.5px}
  #cps{color:var(--dim);font-size:12px;margin-top:5px}
  #layer{color:var(--faint);font-size:11px;margin-top:3px;letter-spacing:2px;text-transform:uppercase}
  #layer.tetr{color:var(--amber)}

  #ui{position:fixed;top:0;left:0;height:100vh;width:344px;z-index:10;
      background:var(--bg1);border-right:1px solid var(--line);
      display:flex;flex-direction:column}
  #ui .scroll{overflow-y:auto;overscroll-behavior:contain;padding:0 14px 20px;flex:1}
  #ui .scroll::-webkit-scrollbar{width:10px}
  #ui .scroll::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid var(--bg1)}
  #ui .scroll::-webkit-scrollbar-track{background:transparent}

  header{padding:14px 16px 12px;border-bottom:1px solid var(--line);margin:0 -14px}
  header h1{margin:0;font-size:18px;letter-spacing:7px;color:var(--txt);font-weight:700}
  header .sub{color:var(--faint);font-size:10px;letter-spacing:1.5px;margin-top:3px;text-transform:uppercase}
  #stats{background:var(--bg2);border:1px solid var(--line);padding:9px 11px;
         font-size:12px;line-height:1.75;color:var(--dim);margin-top:14px}
  #stats b{color:var(--txt);font-weight:600}

  #tabs{display:flex;border-bottom:1px solid var(--line);margin:16px 0 10px}
  #tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;
       color:var(--faint);font-family:inherit;font-size:10.5px;letter-spacing:1.5px;
       padding:8px 0 7px;cursor:pointer;text-transform:uppercase}
  #tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
  #tabs button:hover{color:var(--txt)}

  #tierStrip,#famStrip,#achPages{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0 8px}
  .ts{background:var(--bg2);border:1px solid var(--line);color:var(--dim);font-family:inherit;
      font-size:9.5px;letter-spacing:.5px;padding:4px 6px;cursor:pointer}
  .ts:hover:not(:disabled){color:var(--txt);border-color:var(--dim)}
  .ts.on{border-color:var(--amber);color:var(--amber)}
  .ts.lk{opacity:.45}
  .ts:disabled{opacity:.22;cursor:default}
  .tierName{font-size:11px;color:var(--dim);letter-spacing:2px;margin:2px 0 8px;
            border-bottom:1px dashed var(--line2);padding-bottom:6px}
  .famHead{font-size:10.5px;color:var(--dim);letter-spacing:1px;margin-bottom:8px;
           border-bottom:1px dashed var(--line2);padding-bottom:6px}

  h2{font-size:10px;color:var(--dim);letter-spacing:2.5px;text-transform:uppercase;
     margin:18px 0 8px;padding-bottom:5px;border-bottom:1px dashed var(--line2);font-weight:600}

  #prestige{background:var(--bg2);border:1px solid var(--line);padding:10px 11px}
  #prHeader{display:flex;justify-content:space-between;align-items:baseline;font-size:12px}
  #prHeader b{color:var(--amber)}
  #prHeader span{color:var(--dim);font-size:11px}
  #collapseBtn{width:100%;margin-top:8px;background:none;border:1px solid var(--amber);
       color:var(--amber);font-family:inherit;font-size:11.5px;letter-spacing:1px;
       padding:8px 0;cursor:pointer;text-transform:uppercase}
  #collapseBtn:hover:not(:disabled){background:var(--amber);color:var(--bg0)}
  #collapseBtn:disabled{border-color:var(--line2);color:var(--faint);cursor:default}
  .perk{display:flex;justify-content:space-between;font-size:11px;margin-top:6px;color:var(--faint)}
  .perk.on{color:var(--good)}
  .perk .pk{text-align:right;max-width:200px}

  .bld{display:flex;justify-content:space-between;align-items:center;gap:10px;
       background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--line);
       padding:8px 11px;margin:0 0 5px;cursor:pointer;user-select:none}
  .bld:hover{border-left-color:var(--dim);background:#211c14}
  .bld.cant{opacity:.42;cursor:default}
  .bld.cant:hover{border-left-color:var(--line);background:var(--bg2)}
  .bld b{font-size:12.5px;font-weight:600}
  .bld .owned{color:var(--amber);font-size:11px;margin-left:7px}
  .bld small{display:block;color:var(--faint);font-size:10px;margin-top:2px}
  .bld .cost{font-size:12px;white-space:nowrap;text-align:right;color:var(--good);line-height:1.4}
  .bld.cant .cost{color:var(--bad)}
  .bld .cost small{display:block;color:var(--faint);font-size:9.5px;text-align:right}

  .chips{display:flex;flex-direction:column;gap:5px}
  .chip{background:var(--bg2);border:1px solid var(--line);padding:7px 10px;
        cursor:pointer;user-select:none;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .chip:hover{border-color:var(--dim)}
  .chip.cant{opacity:.42;cursor:default}
  .chip.cant:hover{border-color:var(--line)}
  .chip.owned{border-color:transparent;border-left:3px solid var(--good);opacity:.5;cursor:default}
  .chip b{font-size:12px;font-weight:600}
  .chip small{color:var(--faint);font-size:10.5px;margin-left:8px}
  .chip .cc{font-size:11px;color:var(--good);white-space:nowrap}
  .chip.cant .cc{color:var(--bad)}

  .ach{background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--line);
       padding:7px 10px;margin-bottom:5px;opacity:.45}
  .ach.on{opacity:1;border-left-color:var(--amber)}
  .ach b{font-size:12px}
  .ach small{display:block;color:var(--faint);font-size:10.5px;margin-top:2px}

  #autoBtn{width:100%;margin-top:8px;background:none;border:1px solid var(--line2);
       color:var(--dim);font-family:inherit;font-size:10.5px;letter-spacing:1.5px;
       padding:7px 0;cursor:pointer;text-transform:uppercase}
  #autoBtn:hover:not(.hidden){color:var(--amber);border-color:var(--amber)}
  #autoBtn.hidden{display:none}

  #vig{position:fixed;inset:0;pointer-events:none;z-index:5;
       background:radial-gradient(ellipse at 62% 45%,transparent 52%,rgba(0,0,0,.45) 100%)}

  #frenzy{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:20;
          background:var(--bg0);border:1px solid var(--amber);border-top:none;
          padding:7px 22px 8px;color:var(--amber);font-size:12px;letter-spacing:2px}
  .hidden{display:none !important}

  #toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;
          gap:6px;z-index:30;pointer-events:none}
  .toast{background:var(--bg0);border:1px solid var(--line2);border-left:3px solid var(--dim);
         padding:9px 13px;font-size:11.5px;max-width:320px;letter-spacing:.3px}
  .toast.gold{border-color:var(--amber);border-left-color:var(--amber);color:var(--amber)}
  .toast.out{opacity:0;transform:translateX(24px);transition:all .35s}

  .pop{position:fixed;color:var(--amber);font-weight:700;font-size:15px;pointer-events:none;
       transition:all .85s cubic-bezier(.2,.7,.3,1);z-index:25}
</style>
</head>
<body>
<div id="vig"></div>
<div id="hud">
  <h3 id="ores">0 ores</h3>
  <div id="cps"></div>
  <div id="layer"></div>
</div>
<div id="frenzy" class="hidden">FRENZY ×7 — <span id="frenzyT">30</span>s</div>
<div id="toasts"></div>
<div id="ui">
  <header>
    <h1>STRATA</h1>
    <div class="sub">deep-core mining terminal // rev 6</div>
  </header>
  <div class="scroll">
    <div id="stats"></div>

    <h2>Collapse</h2>
    <div id="prestige">
      <div id="prHeader"><b id="coreCount">0 cores</b><span id="coreMult"></span></div>
      <button id="collapseBtn" disabled>Requires 1e12 lifetime ores</button>
      <div id="perks"></div>
      <button id="autoBtn" class="hidden">AUTO-BUY: ON</button>
    </div>

    <div id="tabs">
      <button data-t="blds" class="on">Machinery</button>

      <div id="tierStrip"></div>

      <div id="famStrip"></div>

    </div>
    <div id="tab-achs" style="display:none">
      <div id="achPages"></div>
      <div id="achs"></div>
    </div>
  </div>
</div>

<!-- Classic (non-module) scripts so the game works when opened directly from disk (file://) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
if(!window.THREE){
  document.body.innerHTML='<div style="padding:40px;font-family:monospace;color:#b0603f">Failed to load Three.js from CDN — check connection and reload.</div>';
  throw new Error('THREE failed to load');
}
/* ================= GAME ================= */

/*====BN-START====*/
/* ============ BIG NUMBER ENGINE v2 — power-tower numerals ============
   value = s · m · 10^(10^(10^(...^E)))   (L tens in the tower)
   L=0  : plain double, |v| < 1e15
   L=1  : s·m·10^E              m∈[1,10)  E∈[15,1e15)
   L>=2 : s·m·10^(10^(...^E))   m>0 floats freely (folds are below
          double precision, so banding m would corrupt same-tower math)
   Layer count is unbounded (up to 9e15) → represents 10^^k for any
   k ≤ ~9e15. Old engine was broken (mul multiplied exponents, minus
   didn't exist, norm could loop). This one is canonical + tested.      */
const MAXE = 1e308;   // per-layer exponent ceiling — tower values up to ~10^10^1e308, layers unbounded

class BN {
  constructor(m=0, E=0, L=0){
    if(typeof m!=='number'||!isFinite(m)||!isFinite(E)||!isFinite(L)){ m=0;E=0;L=0; }
    this.s = m<0 ? -1 : (m>0 ? 1 : 0);
    this.m = Math.abs(m);
    this.E = E; this.L = L;
    this.norm();
  }
  static of(v){
    if(v instanceof BN) return v.clone();
    if(typeof v==='number') return new BN(v);
    return new BN(0);
  }
  clone(){ const r=new BN(0); r.s=this.s; r.m=this.m; r.E=this.E; r.L=this.L; return r; }
  static tetr(h){ // 10^^h
    if(h<=0) return new BN(1);
    if(h===1) return new BN(10);
    if(h===2) return new BN(1e10);
    if(h===3) return new BN(1,1e10,1);
    return new BN(1,1e10,h-2);
  }
  static fromLog10(lg, s=1){ // 10^lg
    if(!isFinite(lg)) return new BN(0);
    if(lg<15) return new BN(s*Math.pow(10,lg));
    if(lg<MAXE){
      const r=new BN(0); r.s=s; r.L=1;
      r.E=Math.floor(lg); r.m=Math.pow(10,lg-r.E);
      if(r.m>=10){r.m/=10;r.E++;} else if(r.m<1){r.m*=10;r.E--;}
      return r;
    }
    const r=new BN(0); r.s=s; r.L=2; r.E=Math.log10(lg); r.m=1; r.norm(); return r;
  }
  norm(){
    if(!(isFinite(this.m)&&isFinite(this.E)&&isFinite(this.L))){ this.s=0;this.m=0;this.E=0;this.L=0; return; }
    if(this.L<0) this.L=0;
    this.L=Math.floor(this.L);
    if(this.s===0||this.m===0){ this.s=0;this.m=0;this.E=0;this.L=0; return; }
    if(this.L===0){
      if(this.m<1e15){ this.E=0; return; }   // L0 band independent of MAXE
      const lg=Math.log10(this.m);
      this.L=1; this.E=Math.floor(lg); this.m=Math.pow(10,lg-this.E);
      if(this.m>=10){this.m/=10;this.E++;} else if(this.m<1){this.m*=10;this.E--;}
      return;
    }
    if(this.L===1){
      const total=this.E+Math.log10(this.m); // = log10|value|
      if(total>=MAXE){ this.L=2; this.E=Math.log10(total); this.m=1; } // fall through
      else if(total<15){ this.L=0; this.m=Math.pow(10,total); this.E=0; return; }
      else {
        this.E=Math.floor(total); this.m=Math.pow(10,total-this.E);
        if(this.m>=10){this.m/=10;this.E++;} else if(this.m<1){this.m*=10;this.E--;}
        return;
      }
    }
    // L>=2: mantissa is NOT banded — folds into the tower are below double
    // precision, so forcing m into [1,10) would inflate same-tower values.
    // m compares directly within equal (L,E); E dominates otherwise.
    let g=0;
    while(this.E>=MAXE && g++<10){ this.L++; this.E=Math.log10(this.E); }
    g=0;
    while(this.L>=2 && this.E<15 && g++<60){ this.L--; this.E=Math.pow(10,this.E); }
    if(this.L===1){
      const total=this.E+Math.log10(this.m);
      if(total<15){ this.L=0; this.m=Math.pow(10,total); this.E=0; }
      else {
        this.E=Math.floor(total); this.m=Math.pow(10,total-this.E);
        if(this.m>=10){this.m/=10;this.E++;} else if(this.m<1){this.m*=10;this.E--;}
      }
    }
    if(this.E>=MAXE){ this.L++; this.E=Math.log10(this.E); }
  }
  log10i(){ // approximate log10 of |value| (Infinity past layer 2)
    if(this.s===0) return -Infinity;
    if(this.L===0) return Math.log10(this.m);
    if(this.L===1) return this.E+Math.log10(this.m);
    return Infinity;
  }
  _cmpmag(o){
    if(this.L!==o.L) return this.L-o.L;
    if(this.L===0) return this.m-o.m;
    if(this.E!==o.E) return this.E-o.E;
    return this.m-o.m;
  }
  cmp(o){ o=BN.of(o); if(this.s!==o.s) return this.s-o.s; return this.s*this._cmpmag(o); }
  gt(o){return this.cmp(o)>0} lt(o){return this.cmp(o)<0}
  gte(o){return this.cmp(o)>=0} lte(o){return this.cmp(o)<=0} eq(o){return this.cmp(o)===0}
  plus(o){
    o=BN.of(o);
    if(this.s===0) return o.clone();
    if(o.s===0) return this.clone();
    let r;
    if(this.s===o.s){ r=this._addmag(o); r.s=this.s; }
    else{
      const c=this._cmpmag(o);
      if(c===0) return new BN(0);
      if(c>0){ r=this._submag(o); r.s=this.s; }
      else{ r=o._submag(this); r.s=o.s; }
    }
    return r;
  }
  neg(){ const r=this.clone(); r.s=-r.s; return r; }
  minus(o){ return this.plus(BN.of(o).neg()); }
  _addmag(o){ // |this|,|o| > 0, result magnitude of sum
    if(this.L===0&&o.L===0) return new BN(this.m+o.m);
    const c=this._cmpmag(o);
    const big=c>=0?this:o, small=c>=0?o:this;
    if(big.L===1){
      if(small.L===0){
        if(big.E-Math.log10(small.m)>15) return big.clone();
        const r=big.clone(); r.m+=small.m*Math.pow(10,-big.E); r.norm(); return r;
      }
      if(big.E-small.E>15) return big.clone();
      const r=big.clone(); r.m+=small.m*Math.pow(10,small.E-big.E); r.norm(); return r;
    }
    if(small.L===big.L && small.E===big.E){ const r=big.clone(); r.m+=small.m; r.norm(); return r; }
    return big.clone(); // layer>=2 absorbs anything not exactly aligned
  }
  _submag(o){ // assumes |this|>|o|
    if(this.L===0) return new BN(this.m-o.m);
    if(this.L===1){
      if(o.L===0){
        if(this.E-Math.log10(o.m)>15) return this.clone();
        const r=this.clone(); r.m-=o.m*Math.pow(10,-this.E); r.norm(); return r;
      }
      if(this.E-o.E>15) return this.clone();
      const r=this.clone(); r.m-=o.m*Math.pow(10,o.E-this.E); r.norm(); return r;
    }
    if(o.L===this.L && o.E===this.E){ const r=this.clone(); r.m-=o.m; r.norm(); return r; }
    return this.clone();
  }
  mul(o){
    o=BN.of(o);
    if(this.s===0||o.s===0) return new BN(0);
    const s=this.s*o.s;
    let r;
    if(this.L===0&&o.L===0){
      r=new BN(this.m*o.m); // <1e30, norm promotes if >=1e15
    }else if(this.L===0||o.L===0){
      const p=this.L===0?this:o, b=this.L===0?o:this;
      r=b.clone(); r.m*=p.m; r.norm();
    }else if(this.L===1&&o.L===1){
      r=BN.fromLog10(Math.log10(this.m*o.m)+this.E+o.E);   // overflow-safe: no E+E double blowup
    }else if(this.L===1||o.L===1){
      const a=this.L===1?this:o, b=this.L===1?o:this; // b.L>=2
      const x=Math.pow(10, Math.log10(a.E)-b.E);      // a.E/10^b.E ∈ (0,1]
      r=b.clone();
      r.E=b.E+(x<1e-15?0:Math.log10(1+x));
      r.m*=a.m; r.norm();
    }else{
      // both L>=2: dominant by LAYER first, then E
      let hi,lo;
      if(this.L===o.L){ hi=this.E>=o.E?this:o; lo=this.E>=o.E?o:this; }
      else if(this.L>o.L){ hi=this; lo=o; }
      else{ hi=o; lo=this; }
      r=hi.clone();
      if(hi.L===lo.L){
        const d=hi.E-lo.E;
        r.E=hi.E+(d>=15?0:Math.log10(1+Math.pow(10,-d)));
      } // else: lower layer's exponent contribution is below precision — dropped
      r.m=this.m*o.m; r.norm();
    }
    r.s=s;
    return r;
  }
  recip(){
    if(this.s===0) return new BN(0);
    if(this.L===0){ const r=new BN(1/this.m); r.s=this.s; return r; }
    if(this.L===1){ const r=new BN((1/this.m)*Math.pow(10,-this.E)); r.s=this.s; return r; }
    return new BN(0); // 1/10^tower underflows the engine's range
  }
  div(o){ o=BN.of(o); return this.mul(o.recip()); }
  pow(k){
    if(typeof k!=='number'||!isFinite(k)) return new BN(0);
    if(k===0) return new BN(1);
    if(k<0) return this.pow(-k).recip();
    if(this.s===0) return new BN(0);
    const s=this.s<0?(Number.isInteger(k)&&k%2===1?-1:1):this.s;
    if(this.L===0){
      const v=Math.pow(this.m,k);
      if(isFinite(v)&&v<MAXE) return new BN(s<0?-v:v);
      return BN.fromLog10(k*Math.log10(this.m), s);
    }
    if(this.L===1) return BN.fromLog10((this.E+Math.log10(this.m))*k, s);
    // L>=2: (m·10^T)^k = 10^frac(k·log10 m) · 10^(10^(E+log10 k))
    const kl=k*Math.log10(this.m);
    const r=this.clone();
    r.E=this.E+Math.log10(k);
    r.m=Math.pow(10, kl-Math.floor(kl));
    r.s=s; r.norm();
    return r;
  }
  toNum(){ if(this.L===0) return this.s*this.m; return this.s*Infinity; }
  fmt(){
    if(this.s===0) return '0';
    const sg=this.s<0?'-':'';
    if(this.L===0){
      const v=this.m;
      if(v<1000) return sg+(v<10?v.toFixed(1):v.toFixed(0));
      return sg+v.toLocaleString(undefined,{maximumFractionDigits:0});
    }
    if(this.L===1) return sg+this.m.toFixed(2)+'e'+Math.floor(this.E).toLocaleString();
    const Ls=this.L>=1e6 ? this.L.toExponential(3) : this.L;   // hyper-towers: 10^^(1.0e+300)
    return sg+'[10^^'+Ls+'] '+this.m.toFixed(2)+'e'+Math.floor(this.E).toLocaleString();
  }
}
function num(v){ return BN.of(v); }
/*====BN-END====*/

/* ================= GAME STATE ================= */
const S={
  ores:num(0),
  total:num(0),
  clicks:0,
  goldenClicks:0,
  frenzies:0,
  luckies:0,
  reloads:0,
  offCollected:0,
  shiftBuys:0,
  clickBase:num(1),
  clickCpsPct:0,
  mult:num(1),
  cores:0,
  collapses:0,
  tetrN:0,             // stacked tower layers from tetration research
  autobuy:true,
  frenzyUntil:0,
  seed:0,              // hidden world seed — drives all procedural generation
  b:{}, up:new Set(), ach:new Set(),
};
const PERKS=[
  {id:'p1', at:50,  name:'Foreman',        desc:'auto-buys cheapest machinery'},
  {id:'p2', at:150, name:'Deep Memory',    desc:'offline 24h, goldens 2x often'},
  {id:'p3', at:400, name:'Transcendence',  desc:'ALL gains ^1.05'},
];
function hasPerk(id){ const p=PERKS.find(x=>x.id===id); return S.cores>=p.at; }
function frenzyMult(){ return performance.now()<S.frenzyUntil ? num(7) : num(1); }
function coreMult(){
  if(S.cores<=0) return num(1);
  let m=BN.fromLog10(S.cores*Math.log10(1.05));
  if(hasPerk('p3')) m=m.pow(1.05);
  return m;
}
function coreLayers(){ return S.cores>1 ? Math.min(45, Math.floor(Math.log10(S.cores)/6.5)) : 0; }
function effMult(){
  const t=BN.tetr(S.tetrN+coreLayers());   // research towers + insane-core layers stack
  return S.mult.mul(coreMult()).mul(frenzyMult()).mul(resCache.allMul).mul(t);
}
let _cpsCache=null;
function baseCPS(){
  if(_cpsCache) return _cpsCache;
  let t=num(0);
  for(const b of BUILDINGS){ const n=S.b[b.id]||0; if(n) t=t.plus(b.cps.mul(num(n))); }
  _cpsCache=t; return t;
}
function dirtyCPS(){ _cpsCache=null; }
function gainAuto(){ return baseCPS().mul(effMult()); }
function gainPerClick(){ return S.clickBase.mul(effMult()).mul(resCache.clickMul).plus(gainAuto().mul(S.clickCpsPct+resCache.cpsPct)); }
function bTotal(){ let t=0; for(const k in S.b) t+=S.b[k]; return t; }
function bKinds(){ return Object.keys(S.b).length; }
function tierReached(t){ const p='t'+String(t).padStart(2,'0')+'m'; return BUILDINGS.some(b=>b.id.startsWith(p)&&S.b[b.id]>0); }
function tierKinds(t){ const p='t'+String(t).padStart(2,'0')+'m'; let c=0; for(const b of BUILDINGS) if(b.id.startsWith(p)&&S.b[b.id]>0) c++; return c; }
function maxMachine(){ let m=0; for(const k in S.b) if(S.b[k]>m) m=S.b[k]; return m; }
function unlockedTier(t){
  if(t===0) return true;
  const p='t'+String(t).padStart(2,'0')+'m';
  return BUILDINGS.some(b=>b.id.startsWith(p)&&S.b[b.id]>0);
}
function maxVisibleTier(){ let m=0; for(let t=1;t<28;t++){ if(unlockedTier(t)) m=t; else break; } return Math.min(m+1,27); }

const BUILDINGS=[];
const TIER_META=[];
(function(){
  // Strata 1-13: wide-spaced but REWARDING — x4 price steps, x15 tier walls,
  // while cps climbs x3.6 per step and x8000 per wall, so payback stays ~150s
  // through the whole ladder (cost/reward ratio never collapses).
  // Strata 14-28: tower strata — cost towers 10^^3..10^^140, cps ONE layer
  // under cost (buffed): a bought-out tower stratum lifts income to its wall.
  const IDX_COST=4, IDX_CPS=3.6, WALL_C=15, WALL_P=8000;
  const NORM=13;
  const TWL=[3,11,25,32,36,40,45,50,55,60,70,80,95,115,140];  // tower heights, strata 14..28
  const TL=t=> Math.log10(15)+t*(63*Math.log10(IDX_COST)+Math.log10(WALL_C));
  const TC=t=> Math.log10(0.1)+t*(63*Math.log10(IDX_CPS)+Math.log10(WALL_P));
  BLD_RAW.forEach((tr,ti)=>{
    TIER_META.push({i:ti,name:tr.name});
    const tw=ti>=NORM ? TWL[ti-NORM] : 0;
    tr.rows.forEach((r,mi)=>{
      let base, cps;
      if(ti<NORM){
        base=BN.fromLog10(TL(ti)+mi*Math.log10(IDX_COST));
        cps=BN.fromLog10(TC(ti)+mi*Math.log10(IDX_CPS));
      }else{
        base=BN.tetr(tw).mul(BN.fromLog10(mi*Math.log10(4)));       // same tower, mantissa steps
        cps=BN.tetr(Math.max(2,tw-1)).mul(BN.fromLog10(mi*Math.log10(3.6)));
      }
      BUILDINGS.push({
        id:'t'+String(ti+1).padStart(2,'0')+'m'+String(mi).padStart(2,'0'),
        tier:ti, name:r[0], desc:r[1], base, cps,
      });
    });
  });
})();
function costOf(b){
  const n=S.b[b.id]||0;
  return b.base.mul(BN.fromLog10(n*Math.log10(1.15))).mul(resCache.machDisc);
}
function buyBuilding(id,n){
  const b=BUILDINGS.find(x=>x.id===id);
  let bought=0;
  for(let i=0;i<n;i++){
    const c=costOf(b);
    if(S.ores.lt(c)) break;
    S.ores=S.ores.minus(c);
    S.b[id]=(S.b[id]||0)+1;
    bought++;
  }
  if(bought){ if(n>=10) S.shiftBuys++; dirtyCPS(); refreshUI(); }
}
function paybackStr(b,cost){
  if(cost.L>=2) return 'tower scale';
  const m=effMult();
  if(m.L>=2) return 'instant';
  const pb=cost.log10i()-b.cps.log10i()-m.log10i();
  if(!isFinite(pb)) return 'tower scale';
  if(pb<0) return 'instant';
  if(pb>12) return 'payback ~'+BN.fromLog10(pb).fmt()+'s';
  const s=Math.pow(10,pb);
  return 'payback '+(s<10?s.toFixed(1):Math.floor(s).toLocaleString())+'s';
}

const MILESTONES=[], FAMILIES=[], UPGRADES=[];
(function(){
  const mc={m1:500,m2:5e4,m3:2e5,m4:2e6,m5:5e8,m6:1e10,m7:1e30,m8:1e80,m13:1e4,
            E400:BN.fromLog10(400),
            TETR4:BN.tetr(4),TETR12:BN.tetr(12),TETR35:BN.tetr(35)};   // keyed by cost token
  RES_RAW.milestones.forEach(u=>{
    MILESTONES.push(Object.assign({},u,{cost: BN.of(typeof u.cost==='string'? (mc[u.cost]||1) : u.cost)}));
  });
  RES_RAW.families.forEach((f,fi)=>{
    f.nodes.forEach((nd,ni)=>{
      UPGRADES.push({
        id:'r'+fi+'n'+String(ni).padStart(2,'0'),
        fam:f.id, famName:f.name, famIdx:fi,
        name:nd[0], desc:nd[1], blurb:f.blurb,
        cost:BN.fromLog10(Math.log10(f.start)+ni*Math.log10(f.growth)),
        eff:f.eff,
        req: ni===0? null : ['r'+fi+'n'+String(ni-1).padStart(2,'0')],
      });
    });
  });
  MILESTONES.forEach(u=>UPGRADES.push(Object.assign({},u,{req:null})));
})();
function reqOk(u){ return !u.req || u.req.every(r=>S.up.has(r)); }
let resCache={clickMul:1,allMul:1,cpsPct:0,frenzyAdd:0,goldMul:1,offCap:0,machDisc:1,resDisc:1,goldenLinger:0};
function rebuildResCache(){
  const c={clickMul:1,allMul:1,cpsPct:0,frenzyAdd:0,goldMul:1,offCap:0,machDisc:1,resDisc:1,goldenLinger:0};
  for(const u of UPGRADES){
    if(!S.up.has(u.id)||!u.eff) continue;
    const e=u.eff;
    switch(e.k){
      case 'clickMul': c.clickMul*=e.v; break;
      case 'allMul': c.allMul*=e.v; break;
      case 'cpsPct': if(u.fam){c.cpsPct+=e.v;} break;
      case 'frenzyAdd': c.frenzyAdd+=e.v; break;
      case 'goldMul': c.goldMul*=e.v; break;
      case 'offCap': c.offCap+=e.v; break;
      case 'machDisc': c.machDisc*=e.v; break;
      case 'resDisc': c.resDisc*=e.v; break;
      case 'goldenLinger': c.goldenLinger=4; break;
    }
  }
  resCache=c;
}
function applyResearch(u){
  const e=u.eff;
  if(e.k==='clickPow'){ S.clickBase=S.clickBase.pow(e.v); }
  else if(e.k==='allPow'){ S.mult=S.mult.pow(e.v); }
  else if(e.k==='allTetr'){ S.tetrN+=e.v; }        // tower research stacks layers
  else if(e.k==='cpsPct'&&!u.fam){ S.clickCpsPct+=e.v; }
  rebuildResCache();
}

/* ============ PRESTIGE ============ */
const PR_REQ=1e12;
function canCollapse(){ return S.total.gte(PR_REQ); }
function coresOnCollapse(){
  // insane levels: tetration-scale lifetime ore pours out cores exponentially —
  // layer 2 -> 10^4, layer 5 -> 10^10, layer 50 -> 10^100, capped at 10^300
  if(S.total.L>=2) return Math.min(1e300, Math.floor(Math.pow(10, Math.min(2*S.total.L,300))));
  return Math.max(1, Math.floor(S.total.log10i()-11));
}
function collapse(){
  if(!canCollapse()) return;
  const g=coresOnCollapse();
  S.cores+=g; S.collapses++;
  S.ores=num(0); S.b={}; S.up=new Set(); S.mult=num(1); S.tetrN=0;
  S.clickBase=num(1); S.clickCpsPct=0; S.frenzyUntil=0;
  despawnGolden();
  dirtyCPS(); rebuildResCache();
  S.seed=(Math.random()*2147483647)|0;   // new seam — new world
  rebuildWorld();
  curTier=0; buildTierStrip(); buildMachineryPage();
  toast('MINE COLLAPSED — +'+g.toLocaleString()+' cores · NEW SEAM FOUND','gold');
  save(); refreshUI();
}

const SAVE_KEY='strataSave_v7';   // v7 = tower-economy reset; all older saves discarded
function rvBN(x){ const b=new BN(0); if(x&&typeof x==='object'){b.s=x.s||0;b.m=x.m||0;b.E=x.E||0;b.L=x.L||0;b.norm();} return b; }
function save(){
  try{
    const json=JSON.stringify({
      v:7, t:Date.now(),
      ores:S.ores, total:S.total, clickBase:S.clickBase, mult:S.mult,
      clicks:S.clicks, goldenClicks:S.goldenClicks, clickCpsPct:S.clickCpsPct,
      frenzies:S.frenzies, luckies:S.luckies, reloads:S.reloads,
      offCollected:S.offCollected, shiftBuys:S.shiftBuys,
      cores:S.cores, collapses:S.collapses, tetrN:S.tetrN, autobuy:S.autobuy, seed:S.seed,
      b:S.b, up:[...S.up], ach:[...S.ach],
    });
    try{ localStorage.setItem(SAVE_KEY,json); }catch(e){ /* quota — mirror still below */ }
    idbSet(SAVE_KEY,json).catch(()=>{});
  }catch(e){}
}
function applySaveData(d){
  if(d.v!==7) return;   // pre-tower-rebalance saves are wiped — fresh start
  S.ores=rvBN(d.ores); S.total=rvBN(d.total);
  S.clickBase=rvBN(d.clickBase); S.mult=rvBN(d.mult);
  S.clicks=d.clicks||0; S.goldenClicks=d.goldenClicks||0; S.clickCpsPct=d.clickCpsPct||0;
  S.frenzies=d.frenzies||0; S.luckies=d.luckies||0; S.reloads=(d.reloads||0)+1;
  S.offCollected=d.offCollected||0; S.shiftBuys=d.shiftBuys||0;
  S.cores=d.cores||0; S.collapses=d.collapses||0; S.tetrN=d.tetrN||0; S.autobuy=d.autobuy!==false;
  S.seed=d.seed||0;
  S.b=d.b||{}; S.up=new Set(d.up||[]); S.ach=new Set(d.ach||[]);
  dirtyCPS(); rebuildResCache();
  const cap=Math.max(hasPerk('p2')?24*3600:2*3600, resCache.offCap);
  const el=Math.min((Date.now()-d.t)/1000, cap);
  if(el>10){
    const g=gainAuto().mul(el);
    if(g.gt(0)){ S.ores=S.ores.plus(g); S.total=S.total.plus(g); S.offCollected++;
      toast('AWAY '+Math.floor(el/60)+' MIN — +'+g.fmt()+' ores'); }
  }
}
function load(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){}
  if(d&&d.v===7){ applySaveData(d); return; }
  // stale pre-v7 data under any key is discarded — full reset
  try{ localStorage.removeItem('strataSave_v6'); localStorage.removeItem('voxelAscend_v3'); }catch(e){}
  ['strataSave_v6','voxelAscend_v3'].forEach(k=>{
    idbGet(k).then(v=>{ if(v) idbSet(k,'').catch(()=>{}); }).catch(()=>{});
  });
}
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('strata',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('saves'); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function idbSet(k,v){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction('saves','readwrite');
    tx.objectStore('saves').put(v,k);
    tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
  });
}
async function idbGet(k){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction('saves','readonly');
    const rq=tx.objectStore('saves').get(k);
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error);
  });
}

const FLOOR_Y=-3.6;
const dummy=new THREE.Object3D();
const boxGeo=new THREE.BoxGeometry(1,1,1);
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function makeNoise(seed){
  function h(ix,iz){
    let n=Math.imul(ix,374761393)+Math.imul(iz,668265263)+Math.imul(seed,1442695041);
    n=Math.imul(n^(n>>>13),1274126177); n^=n>>>16;
    return (n>>>0)/4294967296;
  }
  return function(x,z){
    const ix=Math.floor(x), iz=Math.floor(z), fx=x-ix, fz=z-iz;
    const u=fx*fx*(3-2*fx), v=fz*fz*(3-2*fz);
    const a=h(ix,iz), b=h(ix+1,iz), c=h(ix,iz+1), d=h(ix+1,iz+1);
    return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
  };
}
function chunkGeo(rng){ // rugged voxel boulder — welded vertex displacement
  const g=new THREE.BoxGeometry(2,2,2);
  const pos=g.attributes.position, map={};
  for(let i=0;i<pos.count;i++){
    const k=pos.getX(i).toFixed(2)+','+pos.getY(i).toFixed(2)+','+pos.getZ(i).toFixed(2);
    if(!(k in map)) map[k]=[(rng()-.5)*.55,(rng()-.5)*.55,(rng()-.5)*.55];
    pos.setXYZ(i, pos.getX(i)+map[k][0], pos.getY(i)+map[k][1], pos.getZ(i)+map[k][2]);
  }
  g.computeVertexNormals();
  return g;
}

function buildWorld(seed){
  const rng=mulberry32(seed);
  const pal=PALETTES[Math.floor(rng()*PALETTES.length)];
  const shape=CORE_SHAPES[Math.floor(rng()*CORE_SHAPES.length)];
  // wave personality — color, reach, speed and width all seeded per mine
  const ringCol=new THREE.Color().setHSL(rng(), .78, .62);
  const ringMaxR=7.5+rng()*4.5;
  const ringSpd=.24+rng()*.16;
  const ringW=.3+rng()*.35;
  const noise=makeNoise(seed^0x9e3779b9);
  function hAt(x,z){
    let n=noise(x*.16,z*.16)*.65+noise(x*.33+40,z*.33+40)*.35;
    let h=Math.floor(n*5)/3.2-.45;                    // terraced voxel steps
    const r=Math.hypot(x,z);
    h-=Math.max(0,3.4-r)*.5;                          // central crater bowl
    if(r>7.2) h+=(r-7.2)*.32;                         // rising rim
    if(noise(x*.9+7,z*.9+7)>.83) h+=.6+noise(x*2.3+11,z*2.3-5)*1.9;   // spires: randomized heights
    return h;
  }
  const topAt=(x,z)=>{                      // single source of truth — matches rendered floor everywhere
    const r=Math.hypot(x,z);
    if(r<=8) return FLOOR_Y+hAt(x,z);
    const k=8/r;
    return FLOOR_Y+hAt(x*k,z*k)*(1-Math.min(1,(r-8)/9)*.8)+(r-8)*.012;
  };

  const g=new THREE.Group();
  const tmp=new THREE.Color();
  const bg=new THREE.Color(0x0e0c09);

  /* --- floor: detailed core (-8..8) dissolving into a void plain (r<=24) ---
         one InstancedMesh, one draw call; tiles fade to the void color with
         distance so the mine appears to extend into infinity --- */
  const tiles=[];
  for(let x=-24;x<=24;x++)for(let z=-24;z<=24;z++){
    const r=Math.hypot(x,z);
    if(r<=24) tiles.push([x,z,r]);
  }
  const fIM=new THREE.InstancedMesh(boxGeo,
    new THREE.MeshLambertMaterial({color:0xffffff}),tiles.length);
  fIM.receiveShadow=true; fIM.frustumCulled=false; fIM.userData.sharedG=true;
  const cA=new THREE.Color(pal.a), cB=new THREE.Color(pal.b);
  const BASE=FLOOR_Y-3.2;
  tiles.forEach(([x,z,r],i)=>{
    const top=topAt(x,z);
    const H=Math.max(.18,top-BASE);
    dummy.position.set(x,(top+BASE)/2,z);
    dummy.scale.set(1,H,1); dummy.rotation.set(0,0,0);
    dummy.updateMatrix();
    fIM.setMatrixAt(i,dummy.matrix);
    const fade=Math.min(1,Math.max(0,(r-7.5)/13));
    tmp.copy((x+z)&1?cA:cB).multiplyScalar(.85+rng()*.3)
       .lerp(bg,fade*.94);
    fIM.setColorAt(i,tmp);
  });
  g.add(fIM);

  /* --- ore flecks embedded in the floor --- */
  const fk=new THREE.InstancedMesh(new THREE.BoxGeometry(.24,.11,.24),
    new THREE.MeshBasicMaterial({color:0xffffff}),42);
  fk.frustumCulled=false;
  for(let i=0;i<42;i++){
    const x=(rng()*2-1)*7.5, z=(rng()*2-1)*7.5;
    dummy.position.set(x,topAt(x,z)+.06,z);
    dummy.rotation.set(0,rng()*3,0); dummy.scale.setScalar(.6+rng());
    dummy.updateMatrix(); fk.setMatrixAt(i,dummy.matrix);
    tmp.setHex(rng()<.5?pal.core:pal.acc).multiplyScalar(.65+rng()*.5);
    fk.setColorAt(i,tmp);
  }
  g.add(fk);

  /* --- crystals --- */
  const cr=new THREE.InstancedMesh(new THREE.OctahedronGeometry(.16),
    new THREE.MeshBasicMaterial({color:0xffffff}),14);
  cr.frustumCulled=false;
  for(let i=0;i<14;i++){
    const a=rng()*Math.PI*2, r=2.6+rng()*4.6;
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    dummy.position.set(x,topAt(x,z)+.16,z);
    dummy.rotation.set(rng()*3,rng()*3,0);
    dummy.scale.set(1,.8+rng()*2.2,1);
    dummy.updateMatrix(); cr.setMatrixAt(i,dummy.matrix);
    tmp.setHex(rng()<.5?pal.core:pal.acc).multiplyScalar(.7+rng()*.4);
    cr.setColorAt(i,tmp);
  }
  g.add(cr);

  /* --- the core voxel (seeded shape + palette color) --- */
  let cgeo;
  if(shape==='box') cgeo=new THREE.BoxGeometry(2,2,2);
  else if(shape==='octa') cgeo=new THREE.OctahedronGeometry(1.5);
  else if(shape==='icosa') cgeo=new THREE.IcosahedronGeometry(1.4);
  else if(shape==='dodeca') cgeo=new THREE.DodecahedronGeometry(1.35);
  else cgeo=chunkGeo(rng);
  const coreMat=new THREE.MeshStandardMaterial({
    color:pal.core,
    emissive:new THREE.Color(pal.core).multiplyScalar(.4).getHex(),
    emissiveIntensity:.75,metalness:.55,roughness:.35});
  const core=new THREE.Mesh(cgeo,coreMat);
  core.position.set(0,2,0); core.castShadow=true; g.add(core);

  /* --- upgrade-driven decorations (hidden until research unlocks them) --- */
  const hyper=new THREE.Mesh(new THREE.BoxGeometry(2.7,2.7,2.7),
    new THREE.MeshBasicMaterial({color:pal.acc,wireframe:true,transparent:true,opacity:.32}));
  hyper.position.copy(core.position); hyper.visible=false; g.add(hyper);

  const ring=new THREE.Mesh(new THREE.TorusGeometry(2.5,.05,8,48),
    new THREE.MeshBasicMaterial({color:pal.core,transparent:true,opacity:.5}));
  ring.position.copy(core.position); ring.visible=false; g.add(ring);

  const beamMat=new THREE.MeshBasicMaterial({color:pal.core,transparent:true,opacity:.08,
    blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.45,.95,15,10,1,true),beamMat);
  beam.position.set(0,9.5,0); beam.visible=false; g.add(beam);

  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture,color:pal.core,
    transparent:true,opacity:.26,blending:THREE.AdditiveBlending,depthWrite:false}));
  glow.scale.setScalar(11); glow.position.set(0,2,0); g.add(glow);

  // core point light — the seam itself illuminates the crater
  const plight=new THREE.PointLight(pal.core,.85,22,2);
  plight.position.set(0,2.2,0); g.add(plight);

  /* --- pulse rings: terrain-conforming LineLoops that ride the voxel floor --- */
  const RSEG=96;

    geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(RSEG*3),3));

      transparent:true,opacity:.3,blending:THREE.AdditiveBlending,depthWrite:false}));
    m.frustumCulled=false;
    g.add(m); return m;
  };
  const rings=[0,1].map(i=>{
    const m=mkRing();
    m.userData.ph=i*.5;
    return m;
  });

  /* --- dust motes --- */
  const DN=260, dpos=new Float32Array(DN*3), dpar=[];
  for(let i=0;i<DN;i++){

               ph:rng()*6.28,spd:.15+rng()*.35,rs:(rng()<.5?-1:1)*(.02+rng()*.05)});
  }
  const dgeo=new THREE.BufferGeometry();
  dgeo.setAttribute('position',new THREE.BufferAttribute(dpos,3));
  const dust=new THREE.Points(dgeo,new THREE.PointsMaterial({color:pal.acc,size:.14,
    transparent:true,opacity:.45,blending:THREE.AdditiveBlending,depthWrite:false}));
  dust.frustumCulled=false; g.add(dust);

  /* --- orbiting shards (instanced, count scales with research) --- */

      new THREE.Color(pal.core).multiplyScalar(.3).getHex(),metalness:.5,roughness:.4}),SN);
  shardsIM.castShadow=true; shardsIM.frustumCulled=false;
  shardsIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const shardP=[];
  for(let i=0;i<SN;i++){
    shardP.push({off:i/SN*6.28,r:3+rng()*1.2,spd:.6+rng()*.5,
                 ph:rng()*6.28,amp:.8+rng()*.8,sz:.7+rng()*.7});
  }
  g.add(shardsIM);

  /* --- seeded starfield --- */
  {
    const pos=[];
    for(let i=0;i<600;i++){
      const r=80+rng()*45, th=rng()*Math.PI*2, ph=Math.acos(2*rng()-1);
      pos.push(r*Math.sin(ph)*Math.cos(th), r*Math.cos(ph), r*Math.sin(ph)*Math.sin(th));
    }
    const sg=new THREE.BufferGeometry();
    sg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    const sm=new THREE.PointsMaterial({color:0xbcb2a0,size:.5,sizeAttenuation:true});
    sm.fog=false;
    g.add(new THREE.Points(sg,sm));
  }

  scene.add(g);
  const cCol=new THREE.Color(pal.core);
  const cColF=cCol.clone().lerp(new THREE.Color(0xffffff),.45);
  Object.assign(W,{group:g,hyper,ring,beam,beamMat,glow,plight,rings,dust,dpar,
    shardsIM,shardP,core,coreMat,palette:pal,shape,topAt,cCol,cColF,rseg:RSEG,
    ringCol,ringMaxR,ringSpd,ringW,
    colTop:(x,z)=>topAt(Math.round(x),Math.round(z))});   // exact rendered voxel height
  recomputeCoreVisuals();
}

function spawnGolden(){

    new THREE.MeshBasicMaterial({color:0xf5e6b8}));

  const x=Math.cos(a)*r, z=Math.sin(a)*r;

  golden.userData.born=performance.now();
  scene.add(golden);
  toast('ANOMALY — GOLDEN VOXEL DETECTED','gold');

function despawnGolden(){ if(golden){ scene.remove(golden); golden=null; } }
function clampGolden(){
  if(!golden) return;
  cam.updateMatrixWorld();
  const p=golden.position.clone().applyMatrix4(cam.matrixWorldInverse);
  const d=-p.z;
  if(d<=.5) return;
  const t=Math.tan(cam.fov*Math.PI/360);
  const a=cam.aspect;
  const xMin=((UI_W+60)/innerWidth)*2-1;
  const xMax=((innerWidth-50)/innerWidth)*2-1;
  const yMin=-.85, yMax=.8;
  let px=p.x/(d*t*a), py=p.y/(d*t), ch=false;
  if(px<xMin){px=xMin;ch=true} else if(px>xMax){px=xMax;ch=true}
  if(py<yMin){py=yMin;ch=true} else if(py>yMax){py=yMax;ch=true}
  if(!ch) return;
  p.x=px*d*t*a; p.y=py*d*t;
  golden.position.copy(p.applyMatrix4(cam.matrixWorld));
}
function goldenClick(){

function rateOf(b,c){
  // return rate = cps per ore; tower-scale values compare by layer gap + exponent ratio
  if(b.cps.L>=2||c.L>=2)
    return (b.cps.L-c.L)*1e6 + Math.log10(b.cps.E||15) - Math.log10(c.E||15);
  return b.cps.log10i()-c.log10i();
}
setInterval(()=>{
  if(!hasPerk('p1')||!S.autobuy) return;
  const max=maxVisibleTier();

  for(const b of BUILDINGS){
    if(b.tier>max) continue;
    const c=costOf(b);
    if(S.ores.gte(c)){
      const r=rateOf(b,c);
      if(r>br){ br=r; best=b; bc=c; }
    }
  }
  if(best) buyBuilding(best.id,1e9);   // buy max affordable of the best value
},2000);

let last=performance.now();
function tick(now){
  const dt=Math.min((now-last)/1000,1); last=now;
  frames++;
  const g=gainAuto().mul(dt);
  S.ores=S.ores.plus(g); S.total=S.total.plus(g);

  const t=now/1000;
  const fr=now<S.frenzyUntil;

  // core
  W.core.scale.setScalar(W.core.scale.x+(CV.scale-W.core.scale.x)*.14);
  W.core.rotation.y+=dt*CV.spin; W.core.rotation.x+=dt*CV.spin*.4;
  W.coreMat.emissiveIntensity=CV.emissive*(fr?1.5:1)*(.85+.15*Math.sin(now/280));
  W.coreMat.color.copy(fr?W.cColF:W.cCol);
  W.glow.material.opacity=(fr?.4:.24)+.06*Math.sin(now/350);
  W.glow.scale.setScalar(11*CV.scale);
  W.plight.intensity=(fr?1.6:.85)*CV.emissive*(.85+.15*Math.sin(now/280));
  W.plight.distance=22*CV.scale;

  if(CV.hyper){ W.hyper.rotation.x-=dt*.7; W.hyper.rotation.y+=dt*.5; }
  if(CV.ring){ W.ring.rotation.x+=dt*.9; W.ring.rotation.y+=dt*.4; }
  if(CV.beam){
    W.beam.rotation.y+=dt*.3;
    W.beamMat.opacity=.05+Math.min(S.cores,500)/5000+.02*Math.sin(now/400);
  }

  // shards
  for(let i=0;i<W.shardP.length;i++){
    const p=W.shardP[i];
    if(i<CV.shards){
      const a=t*p.spd+p.off;
      dummy.position.set(Math.cos(a)*p.r, 2+Math.sin(t*1.6+p.ph)*p.amp, Math.sin(a)*p.r);
      dummy.rotation.set(t*2+p.ph, t*3+p.ph, 0);
      dummy.scale.setScalar(p.sz);
    } else dummy.scale.setScalar(0);
    dummy.updateMatrix();
    W.shardsIM.setMatrixAt(i,dummy.matrix);
  }
  W.shardsIM.instanceMatrix.needsUpdate=true;

  // pulse rings — seeded color & reach; EXACT voxel-column ground detection:
  //  1) discrete: expanding radius crossing an integer column with a raised
  //     voxel top erupts sparks at that column's exact top AND re-suspends
  //     grounded debris nearby (the wave kicks the rubble)
  //  2) continuous: vertices sample the RENDERED voxel height (colTop), and
  //     flare white-hot where a taller column stands ahead of the wavefront
  {
    const RSEG=W.rseg, hRef=FLOOR_Y;
    const hitV=new THREE.Vector3();
    const rc=W.ringCol;
    W.rings.forEach(m=>{
      const ph=(t*W.ringSpd+m.userData.ph)%1;
      const R=.7+ph*(W.ringMaxR-.7);
      let prevR=m.userData.prevR;
      if(prevR===undefined||prevR>R) prevR=0;      // new cycle
      m.userData.prevR=R;
      const fade=1-ph;
      const pa=m.geometry.attributes.position.array;
      const ca=m.geometry.attributes.color.array;
      // 1) exact column-crossing impacts + debris kick
      for(let cx=-9;cx<=9;cx++)for(let cz=-9;cz<=9;cz++){
        const d=Math.hypot(cx,cz);
        if(d>prevR&&d<=R){
          const h=W.topAt(cx,cz);                   // integer args = exact column
          if(h>hRef+.18){                           // raised voxel — impact!
            hitV.set(cx,h+.1,cz);
            burst(hitV,2,rc.getHex());
            for(let i=0;i<PMAX;i++){                // wave occasionally flicks grounded rubble
              const q=parts[i];
              if(q.alive&&q.v.y===0&&Math.random()<.22&&
                 Math.abs(q.p.x-cx)<.9&&Math.abs(q.p.z-cz)<.9){
                q.v.y=1+Math.random()*1.1;          // gentle hop — no lifetime reset, still fades
              }
            }
          }
        }
      }
      // 2) terrain-riding ring with wall-ahead flash (voxel-exact heights)
      for(let i=0;i<RSEG;i++){
        const a=i/RSEG*Math.PI*2;
        const ca2=Math.cos(a), sa2=Math.sin(a);
        const x=ca2*R, z=sa2*R;
        const h=W.colTop(x,z);
        const hAhead=W.colTop(ca2*(R+W.ringW),sa2*(R+W.ringW));
        const wall=Math.min(1,Math.max(0,(hAhead-h)/.55));   // 0..1 wall steepness
        pa[i*3]=x; pa[i*3+1]=h+.09; pa[i*3+2]=z;
        const k=fade*(.4+wall*1.5);
        ca[i*3]  =rc.r*k+wall*fade*.65;
        ca[i*3+1]=rc.g*k+wall*fade*.65;
        ca[i*3+2]=rc.b*k+wall*fade*.6;
      }
      m.geometry.attributes.position.needsUpdate=true;
      m.geometry.attributes.color.needsUpdate=true;
      m.material.opacity=.26+.34*fade;
    });
  }

  // dust motes — kept above the voxel floor so they never sink into terrain
  {
    const pa=W.dust.geometry.attributes.position.array;
    for(let i=0;i<W.dpar.length;i++){
      const p=W.dpar[i], a=p.a+t*p.rs;
      const dx=Math.cos(a)*p.r, dz=Math.sin(a)*p.r;
      const h=W.colTop(dx,dz)+.25;
      const y=p.y+Math.sin(t*p.spd+p.ph)*.5;
      pa[i*3]=dx;
      pa[i*3+1]=y>h?y:h;
      pa[i*3+2]=dz;
    }
    W.dust.geometry.attributes.position.needsUpdate=true;
  }

  // particles — gravity-locked debris: falls decisively, rests on terrain, never hovers
  let anyP=false;
  for(let i=0;i<PMAX;i++){
    const p=parts[i];
    if(!p.alive){ continue; }
    anyP=true;
    p.t+=dt;
    const gh=W.colTop(p.p.x,p.p.z);          // exact rendered voxel top — rests flush
    if(p.p.y<=gh+.02){
      p.p.y=gh+.02;
      p.v.set(p.v.x*.25,0,p.v.z*.25);      // skid, no bounce-hover
      p.t+=dt*6;                             // grounded debris fades fast
    }else{
      p.v.y-=22*dt;                          // heavy fall
      p.p.addScaledVector(p.v,dt);
      if(p.p.y<gh+.02) p.p.y=gh+.02;        // never tunnel through a voxel
    }
    const k=1-p.t/.85;
    if(k<=0){ p.alive=false; dummy.scale.setScalar(0); }
    else dummy.scale.setScalar(Math.max(p.s*k,.01));
    dummy.position.copy(p.p);
    dummy.rotation.set(p.t*5,p.t*4,0);
    dummy.updateMatrix();
    pIM.setMatrixAt(i,dummy.matrix);
  }
  if(anyP) pIM.instanceMatrix.needsUpdate=true;

  // golden voxel lifecycle
  if(!golden && now>nextGolden) spawnGolden();
  if(golden){
    golden.rotation.y+=dt*2.4;
    golden.position.y+=Math.sin(t*3)*dt*.6;
    clampGolden();
    if(now-golden.userData.born>12000+resCache.goldenLinger*1000){
      despawnGolden();
      nextGolden=now+(60+Math.random()*120)*1000;
    }
  }

  controls.update();
  // hard floor clamp — damping can nudge past the polar limit on slow frames
  {
    const fy=W.colTop(cam.position.x,cam.position.z)+.8;
    if(cam.position.y<fy) cam.position.y=fy;
  }
  renderer.render(scene,cam);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
setInterval(refreshUI,250);
addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
